name: Production

on:
  workflow_dispatch:
  # Add your preferred cron schedule here.

permissions:
  contents: read
  actions: read

concurrency:
  group: culture-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest database artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          for RUN_ID in $(gh run list \
            --workflow "Production" \
            --status completed \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId'); do
            if gh run download "$RUN_ID" -n culture-db -D data; then
              echo "Restored culture-db from run $RUN_ID"
              break
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install .

      - name: Run culture pipeline
        run: python -m app.runner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_EVENTS_CHAT_ID: ${{ secrets.TELEGRAM_EVENTS_CHAT_ID }}

      - name: Persist database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culture-db
          path: data/culture_events.db
          if-no-files-found: warn
          retention-days: 30
