[project]
name = "culture-events-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
discovery = ["playwright>=1.55,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
